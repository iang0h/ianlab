<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ian Goh Lab, a living map of Ian Goh's projects, experiments, ventures, growth systems, and AI product tools."
    />
    <meta property="og:title" content="Ian Goh Lab" />
    <meta
      property="og:description"
      content="A living lab index for Ian Goh's projects, growth systems, ventures, and utility products."
    />
    <title>Ian Goh Lab | Projects, Experiments, Ventures</title>
  </head>
  <body>
    <div id="root">
      <main
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          background: #0c0c0c;
          color: #d7e2ea;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        "
      >
        <section style="max-width: 560px">
          <p style="margin: 0 0 12px; color: #d9ff4a; font-size: 12px; font-weight: 800; text-transform: uppercase">
            Ian Goh Lab
          </p>
          <h1 style="margin: 0 0 16px; font-size: clamp(40px, 10vw, 88px); line-height: 0.92">
            Start the dev server
          </h1>
          <p style="margin: 0 0 24px; color: rgba(215, 226, 234, 0.72); font-size: 18px; line-height: 1.5">
            This is a Vite React app. Opening this file directly will not compile the TypeScript entrypoint. Use the
            local server instead.
          </p>
          <a
            href="http://127.0.0.1:5173/"
            style="
              display: inline-flex;
              min-height: 48px;
              align-items: center;
              border-radius: 999px;
              padding: 0 20px;
              background: #d9ff4a;
              color: #0c0c0c;
              font-weight: 800;
              text-decoration: none;
              text-transform: uppercase;
            "
          >
            Open local server
          </a>
        </section>
      </main>
    </div>
    <script>
      if (window.location.protocol === 'file:') {
        const devUrl = 'http://127.0.0.1:5173/'
        fetch(devUrl, { mode: 'no-cors' })
          .then(() => {
            window.location.replace(devUrl)
          })
          .catch(() => {})
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
